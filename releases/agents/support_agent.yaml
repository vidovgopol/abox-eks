# Copy into your Flux GitOps repo. Do not commit real API keys.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: support-agent
  namespace: kagent
spec:
  type: BYO
  description: Support assistant with weather lookup (ADK + Anthropic).
  byo:
    deployment:
      image: docker.io/vidovgopol/support_agent:test-v5
      env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: anthropic-api-key
              key: api-key
        - name: MCP_SERVER_URL
          value: "http://test-kmcp-server.kagent:3000/mcp"