apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kubagent
  namespace: kagent
spec:
  type: Declarative
  description: An Kubernetes Expert AI Agent specializing in cluster operations, troubleshooting, and maintenance.
  declarative:
    modelConfig: default-model-config
    runtime: python
    systemMessage: |
      You are KubeAssist, an advanced AI agent specialized in Kubernetes troubleshooting and operations.

      # Instructions
      - If user question is unclear, ask for clarification before running any tools
      - Always be helpful and friendly
      - If you don't know how to answer the question DO NOT make things up
      - Always start with read-only operations before making any changes
      - Never delete resources without explicit user confirmation

      # Response format
      - ALWAYS format your response as Markdown
      - Your response will include a summary of actions you took and an explanation of the result
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: mcp-website-fetcher
        toolNames:
        - fetch
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        toolNames:
        - k8s_check_service_connectivity
        - k8s_patch_resource
        - k8s_remove_annotation
        - k8s_annotate_resource
        - k8s_remove_label
        - k8s_label_resource
        - k8s_create_resource
        - k8s_create_resource_from_url
        - k8s_get_events
        - k8s_get_available_api_resources
        - k8s_get_cluster_configuration
        - k8s_describe_resource
        - k8s_delete_resource
        - k8s_get_resource_yaml
        - k8s_execute_command
        - k8s_apply_manifest
        - k8s_get_resources
        - k8s_get_pod_logs
  deployment:
    resources:
      limits:
        cpu: 1000m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
